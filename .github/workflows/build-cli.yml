name: Build CLI Multi-Platform

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'Tools~/AIBridgeCLI/AIBridgeCLI/**'
      - '.github/workflows/build-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Tools~/AIBridgeCLI/AIBridgeCLI/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: AIBridgeCLI.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: AIBridgeCLI
          - os: macos-latest
            rid: osx-x64
            artifact: AIBridgeCLI
          - os: macos-latest
            rid: osx-arm64
            artifact: AIBridgeCLI

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: |
          dotnet publish Tools~/AIBridgeCLI/AIBridgeCLI/AIBridgeCLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -o Tools~/CLI/${{ matrix.rid }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: Tools~/CLI/${{ matrix.rid }}
          retention-days: 30

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old binaries
        run: |
          git rm -rf Tools~/CLI/ || true
          mkdir -p Tools~/CLI

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: Tools~/CLI
          pattern: cli-*
          merge-multiple: false

      - name: Reorganize artifacts
        run: |
          cd Tools~/CLI
          for dir in cli-*; do
            rid="${dir#cli-}"
            if [ -d "$dir" ]; then
              mkdir -p "$rid"
              mv "$dir"/* "$rid"/ 2>/dev/null || true
              rm -rf "$dir"
            fi
          done
          ls -la */

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tools~/CLI/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CLI binaries for all platforms"
            git push
          fi

  package-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: .release-cli

      - name: Prepare package CLI files
        shell: bash
        run: |
          rm -rf Tools~/CLI

          mkdir -p \
            Tools~/CLI/win-x64 \
            Tools~/CLI/linux-x64 \
            Tools~/CLI/osx-x64 \
            Tools~/CLI/osx-arm64

          install -m 644 \
            .release-cli/cli-win-x64/AIBridgeCLI.exe \
            Tools~/CLI/win-x64/AIBridgeCLI.exe

          install -m 755 \
            .release-cli/cli-linux-x64/AIBridgeCLI \
            Tools~/CLI/linux-x64/AIBridgeCLI

          install -m 755 \
            .release-cli/cli-osx-x64/AIBridgeCLI \
            Tools~/CLI/osx-x64/AIBridgeCLI

          install -m 755 \
            .release-cli/cli-osx-arm64/AIBridgeCLI \
            Tools~/CLI/osx-arm64/AIBridgeCLI

      - name: Validate version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build UPM tarball
        shell: bash
        run: |
          mkdir -p dist

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_file="${package_name}-${package_version}.tgz"

          npm pack --pack-destination dist
          test -f "dist/$package_file"

          tar -tzf "dist/$package_file" \
            "package/Tools~/CLI/win-x64/AIBridgeCLI.exe" >/dev/null
          tar -tzf "dist/$package_file" \
            "package/Tools~/CLI/linux-x64/AIBridgeCLI" >/dev/null
          tar -tzf "dist/$package_file" \
            "package/Tools~/CLI/osx-x64/AIBridgeCLI" >/dev/null
          tar -tzf "dist/$package_file" \
            "package/Tools~/CLI/osx-arm64/AIBridgeCLI" >/dev/null

          cd dist
          sha256sum "$package_file" > "$package_file.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_file="dist/${package_name}-${package_version}.tgz"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$package_file" \
              "$package_file.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$package_file" \
              "$package_file.sha256" \
              --verify-tag \
              --generate-notes
          fi
